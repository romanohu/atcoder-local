[project]
name = "atcoder-local"
version = "0.1.0"
description = "A repository for writing AtCoder solutions locally"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "aclogin>=0.2.1",
    "online-judge-tools>=11.5.1",
    "online-judge-verify-helper==5.6.0",
]

[project.scripts]
acc = "tools.acc_wrapper:console_main"

[build-system]
requires = ["setuptools>=80,<81"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["tools*"]

[dependency-groups]
dev = ["pytest>=9.1.1"]
